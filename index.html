<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suroy CDO</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-image: url("media/background.webp");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        #clickable {
            position: relative;
            z-index: 2;
            cursor: pointer;
        }

        #clickable img {
            width: 300px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 0 60px rgba(255, 255, 255, 0.7);
            border-radius: 500px;
        }

        #clickable img:hover {
            transform: scale(1.1);
            box-shadow: 0 0 150px rgba(255, 255, 255, 0.9);
        }

        #anim {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 3;
            display: none;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="clickable">
        <img src="media/Icon2.svg" alt="Go to Suroy CDO Site">
    </div>

    <video id="anim" autoplay muted playsinline></video>

    <script>
        const clickable = document.getElementById("clickable");
        const anim = document.getElementById("anim");

        clickable.addEventListener("click", function(event) {
            event.preventDefault(); // prevent instant redirect

            anim.src = "media/loading.webm";
            anim.style.display = "block";
            anim.play();

            // Redirect to external site after animation ends
            anim.onended = () => {
                window.location.href = "https://sites.google.com/view/suroy-cdo/home";
            };
        });
    </script>
</body>
</html>




  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticky Scroll Slides</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ✅ INLINE CSS (fixed structure) -->
  <style>
    :root {
      --mobile-gap: 10px;
    }
      body {
    padding-top: 100px;
}
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      scroll-behavior: smooth;
      background: #111;
      color: #fff;
      overflow-x: hidden;
    }
      
      .top-header {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 1400px;
    background: rgba(255, 255, 255);
    backdrop-filter: blur(8px);
    border-radius: 40px;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 9999;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
}

/* --- Logo Button --- */
.logo-btn img {
    width: 45px;
    height: 45px;
    object-fit: cover;
    border-radius: 50%;
    cursor: pointer;
}

/* --- Navigation Buttons --- */
.nav-links {
    display: flex;
    gap: 15px;
}

.nav-links a {
    text-decoration: none;
    color: black;
    font-weight: 600;
    padding: 8px 15px;
    background: white;
    border-radius: 20px;
    transition: 0.2s;
}

.nav-links a:hover {
    background: #ddd;
}

    /* Base scroll section */
    .scroll-section {
      height: 250vh;
    }

    .scroll-section.short {
      height: 100vh;
    }

    .scroll-section.long {
      height: 250vh;
    }

    .sticky-slide {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ---------- SLIDE 1 ---------- */
    #slide1 {
      position: relative;
    }
    #slide1 .logo {
      width: 600px;
      max-width: 80%;
      height: auto;
      z-index: 10;
    }
    #slide1 .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 5;
    }
    #slide1 .bg {
      position: absolute;
      inset: 0;
      background: url('media/background.webp') center/cover no-repeat;
      z-index: 1;
    }

    @media (max-width: 768px) {
      #slide1 {
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
      }
      #slide1 .logo {
        width: 80%;
        max-width: 300px;
      }
    }

    /* ---------- SLIDE 2 ---------- */
    #slide2 {
      background: linear-gradient(to bottom, #00724e, #b6db33);
      color: #222;
    }
    #slide2 .grid-container {
      display: grid;
      grid-template-columns: 5% 50% 40% 5%;
      gap: 1rem;
      align-items: center;
      width: 100%;
      height: 100%;
    }
    #slide2 .video iframe {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 12px;
      border: none;
    }
    #slide2 .text h2 {
      font-size: 2rem;
      margin: 0;
    }
    #slide2 .text p {
      font-size: 1.1rem;
      line-height: 1.5;
    }

    @media (max-width: 768px) {
      #slide2.sticky-slide {
        align-items: flex-start;
        padding-top: 1rem;
      }
      #slide2 .grid-container {
        grid-template-columns: 1fr;
        padding: 1rem;
        gap: var(--mobile-gap);
      }
      #slide2 .video,
      #slide2 .text {
        grid-column: 1;
      }
    }

    /* ---------- SLIDE 3 ---------- */
    #slide3 {
      background: linear-gradient(to bottom, #b6db33, #00724e);
    }

    /* ---------- SLIDE 4 ---------- */
     #slide4 {
      background: linear-gradient(to bottom, #00724e, #b6db33);
      padding: 2rem;
    }
    #slide4 .container {
      display: flex;
      gap: 60px;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      width: 90%;
      max-width: 1200px;
    }
    #slide4 .card {
      position: relative;
      width: 300px;
      height: 450px;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, filter 0.3s ease;
      background-size: cover;
      background-position: center;
      filter: brightness(80%);
    }
    #slide4 .card:hover {
      filter: brightness(100%);
      transform: scale(1.03);
    }
    #slide4 .card .text {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: rgba(0,0,0,0.6);
      padding: 1rem;
      color: #fff;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
    }

    /* Highlight on mobile first tap */
    #slide4 .card.highlight {
      outline: 4px solid #fff;
      filter: brightness(100%);
    }

    /* ---------- Mobile Slide 4 ---------- */
    @media (max-width: 768px) {
      #slide4 .container {
        flex-direction: column;
        align-items: center;
        gap: 30px;
      }
      #slide4 .card {
        width: 90%;
        height: 200px;
        transform: none;
      }
      #slide4 .card .text {
        font-size: 1rem;
        padding: 0.5rem;
    }
  </style>



    
    <header class="top-header">
    <a href="http://suroy-cdo.lovestoblog.com" class="logo-btn">
    <img src="media/Icon.webp" alt="Logo">
</a>
    <nav class="nav-links">
        <a href="#slide2">Vlogs</a>
        <a href="#slide3">Blogs</a>
        <a href="#slide4">The Team</a>
    </nav>
</header>


  <!-- SLIDE 1 -->
  <div class="scroll-section short">
    <div id="slide1" class="sticky-slide">
      <div class="bg"></div>
      <div class="overlay"></div>
      <img src="media/Logo.webp" alt="Logo" class="logo">
    </div>
  </div>

  <!-- SLIDE 2 -->
  <div class="scroll-section long">
    <div id="slide2" class="sticky-slide">
      <div class="grid-container">
        <div class="video">
          <iframe src="https://www.youtube.com/embed/Cp-i5bjs5F0" allowfullscreen=""></iframe>
        </div>
        <div class="text">
          <h2>JSM TRAVEL AND TOURS: Uncovering The Best of Cagayan De Oro</h2>
          <p>
            In this episode of JSM Travel &amp; Tours, we explore Cagayan de Oro,
            the City of Golden Friendship. Discover its vibrant history,
            delicious food, and warm community.
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- SLIDE 3 -->
  <div class="scroll-section long">
    <div id="slide3" class="sticky-slide"></div>
  </div>

  <!-- SLIDE 4 -->
  <div class="scroll-section long">
    <div id="slide4" class="sticky-slide">
      <div class="container" id="imageContainer"></div>
    </div>
  </div>

  <script>
    const isMobile = window.innerWidth <= 768;
    const container = document.getElementById('imageContainer');

    const desktopImages = [
      { src: 'media/person3.png', link: 'https://example.com/desktop1', text: 'Meet Our Locals' },
      { src: 'media/person3.png', link: 'https://example.com/desktop2', text: 'Golden Friendship Stories' },
      { src: 'media/person3.png', link: 'https://example.com/desktop3', text: 'Spirit of the City' }
    ];

    const mobileImages = desktopImages;

    const imagesToUse = isMobile ? mobileImages : desktopImages;

    imagesToUse.forEach(imgData => {
      const card = document.createElement('div');
      card.classList.add('card');
      card.style.backgroundImage = `url('${imgData.src}')`;

      const textDiv = document.createElement('div');
      textDiv.classList.add('text');
      textDiv.textContent = imgData.text;
      card.appendChild(textDiv);

      if (!isMobile) {
        card.onclick = () => window.open(imgData.link, '_blank');
      } else {
        card.onclick = () => {
          if (card.classList.contains('highlight')) {
            window.open(imgData.link, '_blank');
          } else {
            document.querySelectorAll('#slide4 .card').forEach(c => c.classList.remove('highlight'));
            card.classList.add('highlight');
          }
        };
      }

      container.appendChild(card);
    });
  </script>
